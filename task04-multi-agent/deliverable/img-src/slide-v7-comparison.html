<!doctype html>
<html><head><meta charset="utf-8">
<!-- Numbers: evidence/balance-v7/analysis.json (M1, M2, convergence) and decision.json (blind ratings). -->
<style>
  html,body{margin:0;padding:0;background:#fff}
  body{width:1920px;height:768px;position:relative;font-family:"Noto Sans TC";color:#1F2A30}
  table{position:absolute;left:20px;top:10px;width:1880px;border-collapse:separate;border-spacing:0 10px}
  th{font-size:30px;font-weight:700;color:#5F6B70;text-align:left;padding:0 20px}
  th.n{text-align:center}
  td{background:#F4F6F6;font-size:32px;padding:14px 20px;line-height:1.3}

  td:last-child{border-radius:0 14px 14px 0;font-size:30px;color:#4A565C}
  td.n{text-align:center;font-size:50px;font-weight:700;width:210px}
  .v6{color:#5F6B70}
  .good{color:#0E8A6A}
  .bad{color:#B3261E}
  .same{color:#8A969B}
  .banner{position:absolute;left:20px;top:640px;width:1880px;height:100px;box-sizing:border-box;border-radius:14px;
          background:#16302B;color:#fff;display:flex;align-items:center;padding:0 30px;font-size:36px;font-weight:700}
  .banner span{font-weight:400;font-size:30px;color:#C9D8D3;margin-left:24px}
</style></head>
<body>
<table>
  <tr><th>每組 3 次強制衝突</th><th class="n">現行版</th><th class="n">改版</th><th>代表什麼</th></tr>
  <tr><td>定稿裡出自 Auditor 的文字（中位數）</td><td class="n v6">36%</td><td class="n good">14%</td><td>越低，代表 Planner 自己寫得越多</td></tr>

</table>
