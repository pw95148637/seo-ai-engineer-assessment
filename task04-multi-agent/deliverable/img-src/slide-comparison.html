<!doctype html>
<html><head><meta charset="utf-8">
<!-- Three versions, three forced-conflict runs each. Blind ratings: evidence/tiered-v81/decision.json (one package,
     13 finals, the same two raters for all three versions). Suggestions and Auditor-written text:
     evidence/tiered-v81/analysis.json (tiers.suggestions; m1.auditor_share x m1.chars, median of the three runs).
     The two preregistered packages rate the same v6 finals differently (1/3 vs 2/3, reading 4.0 vs 3.0), so only
     directions within this one package are compared. Adoption counts and Auditor-written text are shown in
     neutral grey: accepting a sound suggestion is a judgment too, so neither is scored as good or bad here. Full-width diagram slide with caption: 1920 x 768, smallest text 28 px. -->
<style>
  html,body{margin:0;padding:0;background:#fff}
  body{width:1920px;height:768px;position:relative;font-family:"Noto Sans TC";color:#1F2A30}
  table{position:absolute;left:20px;top:4px;width:1880px;border-collapse:separate;border-spacing:0 9px}
  th{font-size:30px;font-weight:700;color:#5F6B70;text-align:left;padding:0 18px;line-height:1.25}
  th.n{text-align:center}
  td{background:#F4F6F6;font-size:34px;padding:18px 18px;line-height:1.3}
  td:first-child{border-radius:14px 0 0 14px;font-weight:700;width:560px}
  td:last-child{border-radius:0 14px 14px 0;font-size:30px;color:#4A565C}
  td.n{text-align:center;font-size:52px;font-weight:700;width:200px}
  .v6{color:#5F6B70}
  .good{color:#0E8A6A}
  .bad{color:#B3261E}
  .same{color:#8A969B}
  .banner{position:absolute;left:20px;top:648px;width:1880px;height:104px;box-sizing:border-box;border-radius:14px;
          background:#16302B;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 30px}
  .banner b{font-size:34px}
  .banner span{font-size:28px;color:#C9D8D3;margin-top:4px}
</style></head>
<body>
<table>
  <tr><th>每版 3 次強制衝突</th><th class="n">前一版</th><th class="n">分級版</th><th class="n">加上心法</th><th>代表什麼</th></tr>
  <tr><td>兩位評審都判違規的定稿</td><td class="n bad">2／3</td><td class="n good">0／3</td><td class="n good">0／3</td><td>越少越好</td></tr>
  <tr><td>閱讀價值（盲評中位數，1–5）</td><td class="n v6">3.0</td><td class="n good">4.0</td><td class="n good">5.0</td><td>越高越好</td></tr>
  <tr><td>點擊吸引力（同上）</td><td class="n v6">3.5</td><td class="n good">4.0</td><td class="n good">4.0</td><td>越高越好</td></tr>
  <tr><td>Planner 採納的建議</td><td class="n same">—</td><td class="n v6">14／14</td><td class="n v6">14／14</td><td>含一般案例；明示可以不採納後仍不變</td></tr>
  <tr><td>定稿中出自 Auditor 的字數</td><td class="n v6">269</td><td class="n v6">314</td><td class="n v6">359</td><td>中位數；比例 36%→26%→23%，<br>比例下降來自定稿變長</td></tr>
</table>
<div class="banner"><b>依事前登錄：採用分級版，加上心法的版本不採用</b><span>評審沒判違規、閱讀價值不低於前一版；心法版的「不採納次數」與「Auditor 字數」兩條未達登錄門檻</span></div>
</body></html>
