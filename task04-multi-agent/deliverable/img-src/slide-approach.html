<!doctype html>
<html><head><meta charset="utf-8">
<!-- Review comments by strength, the reader's first question; who carries each one is the second line.
     MUST: program checks + Auditor findings (workflow_v8.py, policy_v8.json); the only kind that sends a draft back.
     Suggestions (SHOULD): at most 2 per round, adopt or decline with a reason, attached to the final when not adopted.
     Principles: the two Planner paragraphs of roles_v81.py; tried in v8.1, not adopted under its preregistration
     (evidence/tiered-v81/decision.json), so the adopted version uses only the first two kinds.
     Right-hand image of a split slide: 1600 x 1070, smallest text 36 px. -->
<style>
  html,body{margin:0;padding:0;background:#fff}
  body{width:1600px;height:1070px;position:relative;font-family:"Noto Sans TC";color:#1F2A30}
  .row{position:absolute;left:0;width:1600px;height:330px;box-sizing:border-box;border-radius:18px;border:3px solid;display:flex}
  .lvl{width:420px;box-sizing:border-box;padding:0 30px;display:flex;flex-direction:column;justify-content:center;color:#fff;border-radius:14px 0 0 14px}
  .lvl .n{font-size:52px;font-weight:700;line-height:1.2}
  .lvl .s{font-size:38px;font-weight:700;opacity:.9;margin-top:6px}
  .body{flex:1;padding:0 36px;display:flex;flex-direction:column;justify-content:center;font-size:40px;line-height:1.45}
  .k{font-weight:700}
  .res{margin-top:8px;font-weight:700}
  .must{top:0;border-color:#B3261E;background:#FCEDEC}.must .lvl{background:#B3261E}.must .res{color:#8C1D18}
  .should{top:370px;border-color:#2463A6;background:#EAF2FB}.should .lvl{background:#2463A6}.should .res{color:#1B4C82}
  .tao{top:740px;border-color:#B9C1C4;border-style:dashed;background:#F7F8F8;color:#4A565C}.tao .lvl{background:#8A969B}.tao .res{color:#4A565C}
</style></head>
<body>
<div class="row must">
  <div class="lvl"><div class="n">不可違反</div><div class="s">MUST</div></div>
  <div class="body">
    <div>保證詞、假實測、暗示合法、鼓勵投注</div>
    <div><span class="k">程式</span>擋字面可判定的，<span class="k">Auditor</span> 判其餘</div>
    <div class="res">退件；第 3 輪仍有就轉人工</div>
  </div>
</div>
<div class="row should">
  <div class="lvl"><div class="n">容許合理替代</div><div class="s">建議</div></div>
  <div class="body">
    <div>寫法、角度、補一段內容</div>
    <div><span class="k">Auditor</span> 提最多 2 則，<span class="k">Planner</span> 決定</div>
    <div class="res">不退件；未採納的附在定稿上</div>
  </div>
</div>
<div class="row tao">
  <div class="lvl"><div class="n">取捨方向</div><div class="s">心法</div></div>
  <div class="body">
    <div>有依據就維持，對方對就採納</div>
    <div>寫給 <span class="k">Planner</span> 的處事態度，不是規則</div>
    <div class="res">試過，依登錄未採用</div>
  </div>
</div>
</body></html>
