<!doctype html>
<html><head><meta charset="utf-8">
<!-- Drawn from three takeaways: (1) how the goals conflict, (2) how rejection reasons return through State,
     (3) when the loop stops. Every box and arrow maps to one of them. Used by both doc.md and the deck. -->
<style>
  html,body{margin:0;padding:0;background:#fff}
  body{width:1600px;height:840px;position:relative;font-family:"Noto Sans TC";color:#1F2A30}
  .box{position:absolute;box-sizing:border-box;border-radius:16px;padding:14px 18px;border:3px solid}
  .h{font-size:36px;font-weight:700;line-height:1.2}
  .s{font-size:30px;font-weight:700;line-height:1.3}
  .b{font-size:30px;line-height:1.4;margin-top:8px}
  .tag{display:inline-block;font-size:30px;font-weight:700;padding:0 12px;border-radius:9px;line-height:1.4;margin-top:6px}
  .planner{background:#FDF0E4;border-color:#C46A1F}
  .planner .h,.planner .s{color:#8A4510}
  .auditor{background:#E3F1EC;border-color:#0E8A6A}
  .auditor .h,.auditor .s{color:#0B5E49}
  .model{background:#5A3E8C;color:#fff}
  .guard{background:#46545B;color:#fff}
  .data{background:#2463A6;color:#fff}
  .prog{background:#F2F4F5;border-color:#8A969B}
  .rules{background:#fff;border-color:#0E8A6A;border-style:dashed}
  .rules .h{color:#0B5E49}
  .state{background:#EAF2FB;border-color:#2463A6}
  .state .h{color:#1B4C82}
  .start{background:#16302B;border-color:#16302B;color:#fff}
  .ok{background:#0E8A6A;border-color:#0E8A6A;color:#fff}
  .stop{background:#FFF4E5;border-color:#B5651D}
  .stop .h{color:#8A4510}
  .lbl{position:absolute;font-size:30px;font-weight:700;line-height:1.35;color:#1B4C82}
  svg{position:absolute;left:0;top:0}
</style></head>
<body>
<svg width="1600" height="840">
  <defs>
    <marker id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 z" fill="#46545B"/></marker>
    <marker id="g" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 z" fill="#0E8A6A"/></marker>
    <marker id="b" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 z" fill="#2463A6"/></marker>
  </defs>
  <!-- main flow -->
  <line x1="266" y1="316" x2="302" y2="316" stroke="#46545B" stroke-width="4" marker-end="url(#a)"/>
  <line x1="606" y1="316" x2="642" y2="316" stroke="#46545B" stroke-width="4" marker-end="url(#a)"/>
  <line x1="946" y1="316" x2="982" y2="316" stroke="#46545B" stroke-width="4" marker-end="url(#a)"/>
  <!-- rules only to the Auditor -->
  <line x1="796" y1="146" x2="796" y2="182" stroke="#0E8A6A" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#g)"/>
  <!-- decision exits -->
  <path d="M1270,280 C1292,280 1290,215 1310,215" fill="none" stroke="#46545B" stroke-width="4" marker-end="url(#a)"/>
  <path d="M1270,390 C1292,390 1290,450 1310,450" fill="none" stroke="#46545B" stroke-width="4" marker-end="url(#a)"/>
  <!-- the loop: decision -> State -> planning -->
  <path d="M1128,486 L1128,680 L906,680" fill="none" stroke="#2463A6" stroke-width="6" marker-end="url(#b)"/>
  <line x1="456" y1="588" x2="456" y2="452" stroke="#2463A6" stroke-width="6" marker-end="url(#b)"/>
</svg>

<div class="box start" style="left:16px;top:186px;width:250px;height:260px">
  <div class="h" style="color:#fff">Start</div>
  <div class="b" style="margin-top:4px">流量要求：<br>標題要含<br>「保證出金」<br>或「穩賺不賠」</div>
</div>

<div class="box rules" style="left:646px;top:16px;width:300px;height:130px">
  <div class="h">審核規則</div>
  <div class="b" style="margin-top:4px">只給 Auditor</div>
</div>

<div class="box planner" style="left:306px;top:186px;width:300px;height:260px">
  <div class="h">Planning</div>
  <div class="s">SEO Planner</div>
  <div class="tag model">模型判斷</div>
  <div class="b">追求點擊；<br>看不到規則</div>
</div>

<div class="box auditor" style="left:646px;top:186px;width:300px;height:260px">
  <div class="h">Audit</div>
  <div class="s">YMYL Auditor</div>
  <div class="tag model">模型判斷</div>
  <div class="b">零容忍，<br>有否決權</div>
</div>

<div class="box prog" style="left:986px;top:186px;width:284px;height:300px">
  <div class="h">Decision</div>
  <div class="tag guard">程式把關</div>
  <div class="b">Auditor 放行但<br>稿子仍含指定詞：<br>改判退回；<br>上限 3 輪</div>
</div>

<div class="box ok" style="left:1314px;top:146px;width:270px;height:140px">
  <div class="h">通過</div>
  <div class="b" style="margin-top:4px">輸出最終大綱</div>
</div>

<div class="box stop" style="left:1314px;top:330px;width:270px;height:250px">
  <div class="h">停止，不發布</div>
  <div class="b" style="margin-top:6px">第 3 輪仍退回：<br>轉人工<br>呼叫失敗：<br>重試 1 次後停止</div>
</div>

<div class="box state" style="left:120px;top:588px;width:786px;height:196px">
  <div class="h">State <span class="tag data" style="margin-left:10px;vertical-align:4px">資料</span></div>
  <div class="b">退件原句、讀者風險、改寫建議與上一版草稿，<br>交給下一輪 Planner，由它決定怎麼改</div>
</div>

<div class="lbl" style="left:1145px;top:620px;width:440px">退回且未滿 3 輪</div>
</body></html>
